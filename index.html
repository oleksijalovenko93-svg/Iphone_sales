<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTSPORT — iPhone, аксесуари та периферія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1A1A;
    --bg-base:#1D1D1D;
    --surface:#232323;
    --surface2:#262626;
    --lime:#D9F23C;
    --lime-soft:#ECFD73;
    --text:#FFFFFF;
    --muted:#9A9A9A;
    --muted2:#757575;
    --sale:#E05E56;
    --outline:rgba(255,255,255,0.3);
    --outline-strong:rgba(255,255,255,0.8);
    --dark-on-lime:#1A1A1A;
    --font: 'Montserrat', 'Inter', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img,svg{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  button, input, select, textarea{font-family:var(--font);}
  button{cursor:pointer;}

  .container{
    max-width:1280px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ===== BUTTONS ===== */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 32px;
    font-weight:700;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    border-radius:0;
    border:none;
    white-space:nowrap;
    transition:all .2s ease;
  }
  .btn-primary{
    background:var(--lime);
    color:var(--dark-on-lime);
  }
  .btn-primary:hover{background:var(--lime-soft);}
  .btn-outline{
    background:transparent;
    border:1.5px solid var(--outline-strong);
    color:var(--text);
  }
  .btn-outline:hover{background:rgba(255,255,255,0.08);}
  .btn-full{width:100%;}
  .btn-sm{padding:10px 18px;font-size:11.5px;}

  /* ===== TOPBAR ===== */
  .topbar{
    background:var(--bg-base);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    font-size:12.5px;
    color:var(--muted);
  }
  .topbar-info{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .topbar-info span{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text);
  }
  .logo span{color:var(--lime);}
  .topbar-actions{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    position:relative;
  }
  .icon-btn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:1.6;}
  .cart-count{
    position:absolute;
    top:-8px;
    right:-10px;
    background:var(--lime);
    color:var(--dark-on-lime);
    font-size:10px;
    font-weight:800;
    width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }

  /* ===== NAVBAR (lime strip) ===== */
  .navbar{
    background:var(--lime);
  }
  .navbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
  }
  .nav-links{
    display:flex;
    gap:34px;
  }
  .nav-links a{
    color:var(--dark-on-lime);
    font-weight:800;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition:opacity .2s;
  }
  .nav-links a:hover{opacity:.6;}
  .search-icon svg{width:19px;height:19px;stroke:var(--dark-on-lime);fill:none;stroke-width:2;}
  .nav-toggle{display:none;background:none;border:none;flex-direction:column;gap
